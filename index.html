<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свобода — мессенджер</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #101114;
      color: white;
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth {
      width: 100%;
      max-width: 400px;
      background: #1b1d22;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 10px 40px #0008;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      background: #292c33;
      color: white;
      border: 1px solid #3b3f48;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      cursor: pointer;
      color: white;
      background: #6c63ff;
      width: 100%;
      font-weight: bold;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .switch {
      background: transparent;
      color: #aaa;
      margin-top: 12px;
    }

    .error {
      color: #ff7777;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .messenger {
      display: none;
      height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: 300px;
      background: #181a1f;
      border-right: 1px solid #2b2e35;
      display: flex;
      flex-direction: column;
    }

    .side-top {
      padding: 20px;
      border-bottom: 1px solid #2b2e35;
    }

    .side-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .my-email {
      color: #888;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search {
      margin-top: 15px;
    }

    .users {
      overflow-y: auto;
      flex: 1;
    }

    .user {
      padding: 16px 20px;
      border-bottom: 1px solid #24272d;
      cursor: pointer;
    }

    .user:hover,
    .user.active {
      background: #272a31;
    }

    .user-name {
      font-weight: bold;
    }

    .user-email {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .logout {
      background: #2a2d34;
      margin: 15px 20px;
      width: calc(100% - 40px);
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #101114;
    }

    .chat-head {
      padding: 18px 22px;
      border-bottom: 1px solid #2b2e35;
      font-weight: bold;
      min-height: 65px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #6c63ff;
      border-bottom-right-radius: 5px;
    }

    .theirs {
      align-self: flex-start;
      background: #282b32;
      border-bottom-left-radius: 5px;
    }

    .empty {
      margin: auto;
      color: #777;
      text-align: center;
    }

    .send-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #2b2e35;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-area button {
      width: 100px;
      margin: 0;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 110px;
      }

      .side-title {
        font-size: 20px;
      }

      .my-email,
      .user-email,
      .search {
        display: none;
      }

      .user {
        padding: 16px 10px;
        text-align: center;
      }

      .user-name {
        font-size: 13px;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->
  <div class="screen" id="authScreen">
    <div class="auth">
      <div class="logo">Свобода</div>
      <div class="subtitle">Общайся без границ</div>

      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Пароль">

      <button id="mainButton">Зарегистрироваться</button>
      <button class="switch" id="switchButton">
        Уже есть аккаунт? Войти
      </button>

      <div class="error" id="error"></div>
    </div>
  </div>

  <!-- MESSENGER -->
  <div class="messenger" id="messenger">

    <aside class="sidebar">
      <div class="side-top">
        <div class="side-title">Свобода</div>
        <div class="my-email" id="myEmail"></div>

        <input
          class="search"
          id="search"
          placeholder="Поиск..."
        >
      </div>

      <div class="users" id="users"></div>

      <button class="logout" id="logoutButton">
        Выйти
      </button>
    </aside>

    <main class="chat">
      <div class="chat-head" id="chatHead">
        Выберите пользователя
      </div>

      <div class="messages" id="messages">
        <div class="empty">
          Выберите человека слева, чтобы начать общение.
        </div>
      </div>

      <div class="send-area">
        <input
          id="messageInput"
          placeholder="Напишите сообщение..."
          disabled
        >
        <button id="sendButton" disabled>
          Отправить
        </button>
      </div>
    </main>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      setDoc,
      getDocs,
      doc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // ТВОЙ FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCPih2TQxr4vAMWsuualI4O-bPF3Z0_DH8",
      authDomain: "svoboda-d4dca.firebaseapp.com",
      projectId: "svoboda-d4dca",
      storageBucket: "svoboda-d4dca.firebasestorage.app",
      messagingSenderId: "405083483306",
      appId: "1:405083483306:web:de39b7af3e5bd01a42b4d3",
      measurementId: "G-GC4TYE606V"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // ЭЛЕМЕНТЫ
    const authScreen = document.getElementById("authScreen");
    const messenger = document.getElementById("messenger");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const mainButton = document.getElementById("mainButton");
    const switchButton = document.getElementById("switchButton");

    const errorBox = document.getElementById("error");

    const usersBox = document.getElementById("users");
    const myEmail = document.getElementById("myEmail");

    const searchInput = document.getElementById("search");

    const chatHead = document.getElementById("chatHead");
    const messagesBox = document.getElementById("messages");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const logoutButton = document.getElementById("logoutButton");


    let registerMode = true;
    let currentUser = null;
    let selectedUser = null;
    let unsubscribeMessages = null;
    let allUsers = [];


    // РЕГИСТРАЦИЯ / ВХОД
    switchButton.onclick = () => {

      registerMode = !registerMode;

      errorBox.textContent = "";

      if (registerMode) {
        mainButton.textContent = "Зарегистрироваться";
        switchButton.textContent = "Уже есть аккаунт? Войти";
      } else {
        mainButton.textContent = "Войти";
        switchButton.textContent = "Нет аккаунта? Зарегистрироваться";
      }
    };


    mainButton.onclick = async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorBox.textContent = "";

      if (!email || !password) {
        errorBox.textContent = "Заполни email и пароль.";
        return;
      }

      if (password.length < 6) {
        errorBox.textContent = "Пароль должен быть минимум 6 символов.";
        return;
      }

      try {

        if (registerMode) {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          await setDoc(
            doc(db, "users", result.user.uid),
            {
              email: email,
              createdAt: serverTimestamp()
            }
          );

        } else {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );
        }

      } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {
          errorBox.textContent =
            "Этот email уже зарегистрирован.";
        } else if (error.code === "auth/invalid-credential") {
          errorBox.textContent =
            "Неверный email или пароль.";
        } else if (error.code === "auth/invalid-email") {
          errorBox.textContent =
            "Неверный email.";
        } else {
          errorBox.textContent =
            "Ошибка: " + error.message;
        }
      }
    };


    // СЛЕДИМ ЗА ВХОДОМ
    onAuthStateChanged(auth, async (user) => {

      if (user) {

        currentUser = user;

        authScreen.style.display = "none";
        messenger.style.display = "flex";

        myEmail.textContent = user.email;

        await loadUsers();

      } else {

        currentUser = null;

        authScreen.style.display = "flex";
        messenger.style.display = "none";
      }
    });


    // ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ
    async function loadUsers() {

      const snapshot =
        await getDocs(collection(db, "users"));

      allUsers = [];

      snapshot.forEach((item) => {

        if (item.id !== currentUser.uid) {

          allUsers.push({
            id: item.id,
            ...item.data()
          });
        }
      });

      renderUsers(allUsers);
    }


    // ПОКАЗ ПОЛЬЗОВАТЕЛЕЙ
    function renderUsers(users) {

      usersBox.innerHTML = "";

      if (users.length === 0) {

        usersBox.innerHTML =
          '<div style="padding:20px;color:#777;text-align:center;">Пока никого нет</div>';

        return;
      }

      users.forEach((user) => {

        const element = document.createElement("div");

        element.className = "user";

        element.innerHTML = `
          <div class="user-name">
            ${escapeHtml(user.email)}
          </div>
          <div class="user-email">
            Нажмите, чтобы написать
          </div>
        `;

        element.onclick = () => {
          openChat(user);
        };

        usersBox.appendChild(element);
      });
    }


    // ПОИСК
    searchInput.oninput = () => {

      const text =
        searchInput.value.toLowerCase().trim();

      const filtered =
        allUsers.filter(user =>
          user.email.toLowerCase().includes(text)
        );

      renderUsers(filtered);
    };


    // ОТКРЫТЬ ЧАТ
    function openChat(user) {

      selectedUser = user;

      chatHead.textContent =
        "Чат с " + user.email;

      messageInput.disabled = false;
      sendButton.disabled = false;

      messagesBox.innerHTML = "";

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }


      const chatId = makeChatId(
        currentUser.uid,
        selectedUser.id
      );


      const messagesQuery = query(
        collection(db, "chats", chatId, "messages"),
        orderBy("createdAt", "asc")
      );


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          (snapshot) => {

            messagesBox.innerHTML = "";

            if (snapshot.empty) {

              messagesBox.innerHTML =
                '<div class="empty">Начните общение 👋</div>';

              return;
            }

            snapshot.forEach((item) => {

              const data = item.data();

              const message =
                document.createElement("div");

              message.className =
                "message " +
                (
                  data.senderId === currentUser.uid
                    ? "mine"
                    : "theirs"
                );

              message.textContent = data.text;

              messagesBox.appendChild(message);
            });

            messagesBox.scrollTop =
              messagesBox.scrollHeight;
          },
          (error) => {

            console.error(error);

            messagesBox.innerHTML =
              '<div class="empty">Не удалось загрузить сообщения.</div>';
          }
        );
    }


    // ОТПРАВКА
    async function sendMessage() {

      if (!currentUser || !selectedUser) return;

      const text =
        messageInput.value.trim();

      if (!text) return;


      const chatId = makeChatId(
        currentUser.uid,
        selectedUser.id
      );


      try {

        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            createdAt: serverTimestamp()
          }
        );

        messageInput.value = "";

      } catch (error) {

        console.error(error);

        alert(
          "Сообщение не отправилось. Проверь правила Firestore."
        );
      }
    }


    sendButton.onclick = sendMessage;


    messageInput.onkeydown = (event) => {

      if (event.key === "Enter") {
        sendMessage();
      }
    };


    // ВЫХОД
    logoutButton.onclick = async () => {

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      await signOut(auth);
    };


    // ОДИН ID ДЛЯ ДВУХ СОБЕСЕДНИКОВ
    function makeChatId(a, b) {

      return [a, b].sort().join("_");
    }


    // ЗАЩИТА ОТ HTML В EMAIL
    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
