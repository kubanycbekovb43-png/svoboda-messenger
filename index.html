<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свобода</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
      height: 100vh;
    }

    button, input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #auth {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      background: #1c1f26;
      padding: 30px;
      border-radius: 22px;
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      background: #292d36;
      border: none;
      outline: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .main-btn {
      width: 100%;
      border: none;
      background: #4f7cff;
      color: white;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #4f7cff;
      cursor: pointer;
    }

    /* APP */

    #app {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background: #191c22;
      border-right: 1px solid #2b2f37;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid #2b2f37;
    }

    .app-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #4f7cff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 19px;
      flex-shrink: 0;
    }

    .profile-name {
      font-weight: bold;
    }

    .profile-status {
      color: #5ee38b;
      font-size: 12px;
      margin-top: 3px;
    }

    .search {
      margin: 0;
    }

    .users {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid #23262d;
    }

    .user-item:hover {
      background: #242830;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-email {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-online {
      color: #5ee38b;
      font-size: 12px;
      margin-top: 4px;
    }

    .user-offline {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .chat-header {
      height: 70px;
      background: #191c22;
      border-bottom: 1px solid #2b2f37;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
    }

    .chat-name {
      font-weight: bold;
    }

    .chat-status {
      color: #5ee38b;
      font-size: 12px;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .my-message {
      background: #4f7cff;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .their-message {
      background: #292d36;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message-time {
      font-size: 10px;
      opacity: .65;
      margin-top: 4px;
      text-align: right;
    }

    .send-area {
      padding: 12px;
      background: #191c22;
      display: flex;
      gap: 10px;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-btn {
      width: 50px;
      border: none;
      border-radius: 12px;
      background: #4f7cff;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    .logout {
      border: none;
      background: transparent;
      color: #ff6b6b;
      cursor: pointer;
      margin-left: auto;
    }

    .back-btn {
      display: none;
      border: none;
      background: transparent;
      color: white;
      font-size: 23px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat {
        display: none;
      }

      #app.chat-open .sidebar {
        display: none;
      }

      #app.chat-open .chat {
        display: flex;
      }

      .back-btn {
        display: block;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->

  <section id="auth">
    <div class="auth-box">

      <div class="logo">Свобода</div>
      <div class="subtitle">Общайся свободно</div>

      <div id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Пароль">

        <button class="main-btn" onclick="login()">
          Войти
        </button>

        <div class="switch" onclick="showRegister()">
          Создать аккаунт
        </div>
      </div>

      <div id="registerForm" class="hidden">
        <input id="registerEmail" type="email" placeholder="Email">
        <input id="registerPassword" type="password" placeholder="Пароль">

        <button class="main-btn" onclick="register()">
          Зарегистрироваться
        </button>

        <div class="switch" onclick="showLogin()">
          Уже есть аккаунт
        </div>
      </div>

    </div>
  </section>


  <!-- APP -->

  <section id="app" class="hidden">

    <!-- USERS -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <div class="app-title">
          Свобода
        </div>

        <div class="profile-mini" onclick="openMyProfile()">
          <div class="avatar" id="myAvatar">?</div>

          <div>
            <div class="profile-name" id="myName">
              Мой профиль
            </div>

            <div class="profile-status">
              ● онлайн
            </div>
          </div>

          <button class="logout" onclick="logout(event)">
            Выйти
          </button>
        </div>

        <input
          class="search"
          id="searchInput"
          placeholder="🔎 Поиск пользователей..."
          oninput="searchUsers()"
        >

      </div>

      <div class="users" id="usersList"></div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

      <div id="emptyChat" class="chat-empty">
        <div>
          <div style="font-size:50px;">💬</div>
          <br>
          <b>Выбери человека</b>
          <br>
          чтобы начать общение
        </div>
      </div>


      <div id="activeChat" class="hidden" style="height:100%; display:flex; flex-direction:column;">

        <header class="chat-header">

          <button class="back-btn" onclick="closeChat()">
            ←
          </button>

          <div class="avatar" id="chatAvatar">
            ?
          </div>

          <div>
            <div class="chat-name" id="chatName">
              Пользователь
            </div>

            <div class="chat-status" id="chatStatus">
              ● онлайн
            </div>
          </div>

        </header>


        <div class="messages" id="messages"></div>


        <div class="send-area">

          <input
            id="messageInput"
            placeholder="Написать сообщение..."
            onkeydown="handleEnter(event)"
          >

          <button class="send-btn" onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </main>

  </section>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      getDocs
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCPih2TQxr4vAMWsuualI4O-bPF3Z0_DH8",
      authDomain: "svoboda-d4dca.firebaseapp.com",
      projectId: "svoboda-d4dca",
      storageBucket: "svoboda-d4dca.firebasestorage.app",
      messagingSenderId: "405083483306",
      appId: "1:405083483306:web:de39b7af3e5bd01a42b4d3",
      measurementId: "G-GC4TYE606V"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let currentUser = null;
    let selectedUser = null;
    let unsubscribeMessages = null;
    let allUsers = [];


    /* AUTH */

    window.showRegister = function() {
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("registerForm").classList.remove("hidden");
    };


    window.showLogin = function() {
      document.getElementById("registerForm").classList.add("hidden");
      document.getElementById("loginForm").classList.remove("hidden");
    };


    window.register = async function() {

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;


      if (!email || !password) {
        alert("Заполни все поля");
        return;
      }


      try {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await setDoc(
          doc(db, "users", result.user.uid),
          {
            email: email,
            createdAt: serverTimestamp(),
            online: true
          }
        );


        alert("Аккаунт создан!");

      } catch (error) {

        alert(error.message);

      }

    };


    window.login = async function() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email || !password) {
        alert("Заполни все поля");
        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        alert("Ошибка входа: " + error.message);

      }

    };


    window.logout = async function(event) {

      if (event) {
        event.stopPropagation();
      }

      if (currentUser) {

        try {

          await setDoc(
            doc(db, "users", currentUser.uid),
            {
              online: false
            },
            { merge: true }
          );

        } catch {}

      }

      await signOut(auth);

    };


    /* AUTH STATE */

    onAuthStateChanged(auth, async user => {

      if (user) {

        currentUser = user;

        document.getElementById("auth")
          .classList.add("hidden");

        document.getElementById("app")
          .classList.remove("hidden");


        document.getElementById("myName")
          .textContent = user.email;


        document.getElementById("myAvatar")
          .textContent =
          user.email.charAt(0).toUpperCase();


        await setDoc(
          doc(db, "users", user.uid),
          {
            email: user.email,
            online: true
          },
          { merge: true }
        );


        loadUsers();

      } else {

        currentUser = null;

        document.getElementById("auth")
          .classList.remove("hidden");

        document.getElementById("app")
          .classList.add("hidden");

      }

    });


    /* USERS */

    async function loadUsers() {

      const snapshot =
        await getDocs(collection(db, "users"));


      allUsers = [];


      snapshot.forEach(item => {

        const data = item.data();

        if (item.id !== currentUser.uid) {

          allUsers.push({
            id: item.id,
            ...data
          });

        }

      });


      renderUsers(allUsers);

    }


    function renderUsers(users) {

      const list =
        document.getElementById("usersList");

      list.innerHTML = "";


      if (users.length === 0) {

        list.innerHTML =
          `<div style="padding:25px;color:#777;text-align:center">
            Пока нет других пользователей
          </div>`;

        return;

      }


      users.forEach(user => {

        const item =
          document.createElement("div");

        item.className = "user-item";


        const letter =
          (user.email || "?")
          .charAt(0)
          .toUpperCase();


        item.innerHTML = `

          <div class="avatar">
            ${letter}
          </div>

          <div class="user-info">

            <div class="user-email">
              ${user.email || "Пользователь"}
            </div>

            <div class="${user.online ? "user-online" : "user-offline"}">
              ${user.online ? "● онлайн" : "не в сети"}
            </div>

          </div>

        `;


        item.onclick = () => openChat(user);

        list.appendChild(item);

      });

    }


    window.searchUsers = function() {

      const text =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


      const filtered =
        allUsers.filter(user =>
          (user.email || "")
          .toLowerCase()
          .includes(text)
        );


      renderUsers(filtered);

    };


    /* CHAT */

    window.openChat = function(user) {

      selectedUser = user;


      document.getElementById("emptyChat")
        .classList.add("hidden");


      document.getElementById("activeChat")
        .classList.remove("hidden");


      document.getElementById("chatName")
        .textContent = user.email;


      document.getElementById("chatAvatar")
        .textContent =
        user.email.charAt(0).toUpperCase();


      document.getElementById("chatStatus")
        .textContent =
        user.online ? "● онлайн" : "не в сети";


      document.getElementById("app")
        .classList.add("chat-open");


      loadMessages();

    };


    function getChatId() {

      return [
        currentUser.uid,
        selectedUser.id
      ].sort().join("_");

    }


    function loadMessages() {

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }


      const chatId = getChatId();


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const q =
        query(
          messagesRef,
          orderBy("createdAt", "asc")
        );


      unsubscribeMessages =
        onSnapshot(q, snapshot => {

          const container =
            document.getElementById("messages");

          container.innerHTML = "";


          snapshot.forEach(item => {

            const message =
              item.data();


            const div =
              document.createElement("div");


            const mine =
              message.senderId === currentUser.uid;


            div.className =
              mine
              ? "message my-message"
              : "message their-message";


            const time =
              message.createdAt
              ? message.createdAt
                  .toDate()
                  .toLocaleTimeString(
                    [],
                    {
                      hour: "2-digit",
                      minute: "2-digit"
                    }
                  )
              : "";


            div.innerHTML = `

              <div>${escapeHtml(message.text)}</div>

              <div class="message-time">
                ${time}
              </div>

            `;


            container.appendChild(div);

          });


          container.scrollTop =
            container.scrollHeight;

        });

    }


    window.sendMessage = async function() {

      const input =
        document.getElementById("messageInput");


      const text =
        input.value.trim();


      if (!text || !selectedUser) {
        return;
      }


      const chatId = getChatId();


      try {

        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {
            text: text,
            senderId: currentUser.uid,
            receiverId: selectedUser.id,
            createdAt: serverTimestamp()
          }
        );


        input.value = "";


      } catch (error) {

        alert(
          "Не удалось отправить сообщение: "
          + error.message
        );

      }

    };


    window.handleEnter = function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    };


    window.closeChat = function() {

      document.getElementById("app")
        .classList.remove("chat-open");


      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }


      selectedUser = null;

    };


    /* PROFILE */

    window.openMyProfile = function() {

      if (!currentUser) return;

      alert(
        "Мой профиль\n\n" +
        "Email: " +
        currentUser.email
      );

    };


    /* SECURITY */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
  </html>
